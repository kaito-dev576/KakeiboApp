<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>取引を編集</title>

    <link
        rel="icon"
        href="{{ url_for('static', filename='favicon.svg') }}"
        type="image/svg+xml"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="container form-page mt-4">

    <h1>取引を編集</h1>

    <form method="POST">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">
                {{ message }}
            </div>
            {% endfor %}
        {% endwith %}

        <!-- 金額 -->
        <div class="mb-3">
            <label for="price" class="form-label">
                金額
            </label>

            <input
                id="price"
                type="text"
                name="price"
                class="form-control"
                inputmode="numeric"
                pattern="[0-9]+"
                value="{{ expense.price }}"
                required
            >
        </div>

        <!-- 日付 -->
        <div class="mb-3">
            <label for="date" class="form-label">
                日付
            </label>

            <input
                id="date"
                type="date"
                name="date"
                class="form-control"
                value="{{ expense.date.strftime('%Y-%m-%d') }}"
                required
            >
        </div>

        <!-- 種類 -->
        <div class="mb-3">
            <label for="typeSelect" class="form-label">
                種類
            </label>

            <select
                id="typeSelect"
                name="type"
                class="form-select"
            >
                <option
                    value="支出"
                    {% if expense.type == "支出" %}selected{% endif %}
                >
                    支出
                </option>

                <option
                    value="収入"
                    {% if expense.type == "収入" %}selected{% endif %}
                >
                    収入
                </option>
            </select>
        </div>

        <!-- カテゴリー -->
        <div class="mb-3">
            <label for="categorySelect" class="form-label">
                カテゴリー
            </label>

            <select
                id="categorySelect"
                name="category"
                class="form-select"
                required
            >
                <option value="">
                    カテゴリーを選択してください
                </option>

                {% for category in categories %}
                <option
                    value="{{ category.name }}"
                    data-type="{{ category.type }}"
                    {% if expense.category == category.name %}selected{% endif %}
                >
                    {{ category.icon }} {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                更新
            </button>

            <a
                href="{{ url_for('expense.index') }}"
                class="btn btn-outline-secondary"
            >
                キャンセル
            </a>
        </div>
    </form>

</div>

<script>
    const typeSelect =
        document.getElementById("typeSelect");

    const categorySelect =
        document.getElementById("categorySelect");

    function filterCategories(resetCategory = false) {
        const selectedType = typeSelect.value;

        for (const option of categorySelect.options) {
            if (option.value === "") {
                continue;
            }

            option.hidden =
                option.dataset.type !== selectedType;
        }

        if (resetCategory) {
            categorySelect.value = "";
        }
    }

    typeSelect.addEventListener("change", () => {
        filterCategories(true);
    });

    // 最初に開いたときは、登録済みカテゴリーを維持する
    filterCategories(false);
</script>

</body>
</html>
