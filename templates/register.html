<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">

    <h1>ユーザー登録</h1>
  

    <form method="POST">

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <div class="mb-3">
            <label class="form-label">ユーザー名</label>
            <input
                type="text"
                name="username"
                class="form-control"
                required
            >   
        </div>

        <div class="mb-3">
            <label class="form-label">パスワード</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required
            >
        </div>

        <button class="btn btn-primary">
            登録
        </button>

    </form>
</div>
</body>
</html>
