{% extends "base.html" %}

{% block title %}予算設定{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">

        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h2 mb-1">予算設定</h1>
                <p class="text-body-secondary mb-0">
                    月ごとの支出予算を設定できます。
                </p>
            </div>

            <span class="fs-2">💰</span>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="year" class="form-label">年</label>
                            <input
                                type="number"
                                id="year"
                                name="year"
                                class="form-control"
                                value="{{ year }}"
                                min="2000"
                                max="2100"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="month" class="form-label">月</label>
                            <select
                                id="month"
                                name="month"
                                class="form-select"
                                required
                            >
                                {% for number in range(1, 13) %}
                                <option
                                    value="{{ number }}"
                                    {% if number == month %}selected{% endif %}
                                >
                                    {{ number }}月
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="budget" class="form-label">
                                今月の予算
                            </label>

                            <div class="input-group input-group-lg">
                                <input
                                    type="number"
                                    id="budget"
                                    name="budget"
                                    class="form-control"
                                    value="{{ budget.budget if budget else '' }}"
                                    min="1"
                                    placeholder="例：50000"
                                    required
                                >
                                <span class="input-group-text">円</span>
                            </div>

                            <div class="form-text">
                                同じ年月を設定すると、予算額を更新できます。
                            </div>
                        </div>

                        <div class="col-12 d-grid mt-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                予算を保存する
                            </button>
                        </div>

                    </div>
                </form>

            </div>
        </div>

        {% if budget %}
        <div class="alert alert-info mt-3 mb-0">
            {{ year }}年{{ month }}月の現在の予算は
            <strong>{{ "{:,}".format(budget.budget) }}円</strong>です。
        </div>
        {% endif %}

    </div>
</div>
{% endblock %}
