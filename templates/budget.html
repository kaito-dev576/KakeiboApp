<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>予算設定</title>
</head>
<body>

<h1>予算設定</h1>

<form method="POST">

    <p>
        年
        <input type="number" name="year" required>
    </p>

    <p>
        月
        <input type="number" name="month" min="1" max="12" required>
    </p>

    <p>
        予算
        <input type="number" name="budget" required>
    </p>

    <button type="submit">保存</button>

</form>

</body>
</html>
