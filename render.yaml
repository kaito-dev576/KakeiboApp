services:
  - type: web
    name: kakeibo-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kakeibo-db
          property: connectionString

databases:
  - name: kakeibo-db
    plan: free
